<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mapa de Assentos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: aplicativo de uma coluna, estilo painel de rodoviária. Abas fixas embaixo (Rotas, Clientes), mapa do ônibus centralizado, formulários em folha que sobe de baixo. */
:root{
  --bg:#edf1ee; --surface:#fbfcfb; --ink:#14231f; --muted:#596a64; --line:#d2dbd6;
  --accent:#0f5b52; --accent-fg:#ffffff; --accent-soft:#d9ebe6;
  --signal:#e8a317; --danger:#b3261e; --danger-soft:#f7dedb;
  --seat-free:#ffffff; --seat-free-line:#b9c6c0; --seat-occ:#0f5b52; --seat-occ-fg:#ffffff;
  --shadow:0 -8px 30px rgba(10,30,25,.18);
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1512; --surface:#15211d; --ink:#e7f0ec; --muted:#93a59e; --line:#2a3a35;
  --accent:#47c3ac; --accent-fg:#06211b; --accent-soft:#183a33;
  --signal:#f0b53a; --danger:#ff8a80; --danger-soft:#3b1d1a;
  --seat-free:#1b2925; --seat-free-line:#3a4d47; --seat-occ:#47c3ac; --seat-occ-fg:#06211b;
  --shadow:0 -8px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1512; --surface:#15211d; --ink:#e7f0ec; --muted:#93a59e; --line:#2a3a35;
  --accent:#47c3ac; --accent-fg:#06211b; --accent-soft:#183a33;
  --signal:#f0b53a; --danger:#ff8a80; --danger-soft:#3b1d1a;
  --seat-free:#1b2925; --seat-free-line:#3a4d47; --seat-occ:#47c3ac; --seat-occ-fg:#06211b;
  --shadow:0 -8px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body);padding-inline:16px;padding-block:0 96px}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance}
.wrap{max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:20px 14px}
.top h1{font-size:30px;line-height:1.05}
.eyebrow{font:600 12px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:600;background:var(--accent);color:var(--accent-fg);cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.small{padding:7px 12px;min-height:36px;font-size:14px}
.btn:focus-visible,.seat:focus-visible,.card:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}

/* rotas */
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;width:100%;cursor:pointer;display:block}
.rwrap{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.card .trajeto{font:700 26px/1.1 var(--f-display);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card .trajeto i{font-style:normal;color:var(--accent)}
.meta{color:var(--muted);font-size:14px;margin-top:4px}
.bar{height:8px;border-radius:99px;background:var(--accent-soft);margin-top:12px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar-l{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:22px;margin-bottom:6px}
.empty .btn{margin-top:14px}

/* mapa do ônibus */
.busbox{background:var(--surface);border:1px solid var(--line);border-radius:28px 28px 16px 16px;padding:14px 14px 18px;max-width:400px;margin:16px auto}
.front{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 12px;border-bottom:2px dashed var(--line);margin-bottom:12px;font:600 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.wheel{display:flex;align-items:center;gap:6px}
.wheel svg{width:26px;height:26px;stroke:var(--muted);fill:none;stroke-width:2}
.seats{display:flex;flex-direction:column;gap:8px}
.srow{display:flex;gap:6px;align-items:stretch}
.aisle{flex:0 0 22px}
.grp{flex:1;display:flex;gap:6px;min-width:0}
.seat{flex:1;min-width:0;border:1.5px solid var(--seat-free-line);background:var(--seat-free);border-radius:9px 9px 6px 6px;padding:5px 3px 6px;min-height:58px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.seat .n{font:700 15px/1 var(--f-display);color:var(--muted);font-variant-numeric:tabular-nums}
.seat .who{font-size:11px;line-height:1.1;font-weight:600;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.seat.occ{background:var(--seat-occ);border-color:var(--seat-occ);color:var(--seat-occ-fg)}
.seat.occ .n{color:var(--seat-occ-fg);opacity:.75}
.seat.cur{box-shadow:0 0 0 3px var(--signal)}
.blk{flex:1;min-width:0;border:1.5px dashed var(--line);border-radius:8px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;min-height:58px}
.blk.wide{margin-top:10px;min-height:38px}
.seat{position:relative}
.vend{position:absolute;right:3px;bottom:3px;font-size:10px;line-height:1;font-weight:700;background:var(--signal);color:#201500;border-radius:6px;padding:2px 5px}
.paxbtn{border:0;background:transparent;text-align:left;font:inherit;color:inherit;padding:6px 0;cursor:pointer;overflow-wrap:anywhere}
.vtag{font-size:12px;font-weight:700;background:var(--signal);color:#201500;border-radius:6px;padding:2px 7px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:99px;padding:8px 14px;font-weight:600;min-height:40px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.bigov{position:fixed;inset:0;background:var(--bg);z-index:8;overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
.bighead{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.bighead h2{font-size:30px}
.bigbody{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;align-items:flex-start}
.big .busbox{flex:1 1 420px;max-width:640px;margin:0}
.big .seat{min-height:88px;padding:8px 6px 18px}
.big .seat .n{font-size:20px}
.big .seat .who{font-size:15px;-webkit-line-clamp:3}
.big .seat .vend{font-size:12px}
.big .blk{min-height:88px;font-size:13px}
@media print{.vend,.vtag,.tabs,.top,.toast,.legend{display:none!important}}
.legend{display:flex;gap:16px;justify-content:center;font-size:13px;color:var(--muted);margin-top:14px}
.legend span{display:flex;gap:6px;align-items:center}
.sw{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--seat-free-line);background:var(--seat-free)}
.sw.o{background:var(--seat-occ);border-color:var(--seat-occ)}
.pax{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pax div{display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.pax div:last-child{border-bottom:0}
.pax b{font:700 18px/1 var(--f-display);min-width:34px;color:var(--accent);font-variant-numeric:tabular-nums}
.sec{margin-top:26px;display:flex;flex-direction:column;gap:10px}
.sec h2{font-size:22px}

/* clientes */
.search{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);min-height:46px}
.cli{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.cli .info{flex:1;min-width:0}
.cli .nm{font-weight:600;overflow-wrap:anywhere}
.cli .sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.av{flex:0 0 38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 16px/1 var(--f-display)}

/* navegação */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px));gap:8px;z-index:5}
.tab{flex:1;max-width:280px;margin:0 auto;border:0;background:transparent;border-radius:10px;padding:10px;font-weight:600;color:var(--muted);cursor:pointer;min-height:46px}
.tab[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}

/* folha */
.ov{position:fixed;inset:0;background:rgba(6,16,13,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:26px}
label{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:600}
label input,label select{font-weight:400;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);min-height:46px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.pick .tag{font-size:12px;color:var(--signal);font-weight:600}
.occ-box{background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.occ-box .nm{font-weight:600;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:90%}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}}}

#login{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
#login form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
#login h1{font-size:30px;margin:0}
#login label{display:flex;flex-direction:column;gap:4px;font-size:14px}
#login input{font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
#login .erro{color:#b3261e;font-size:14px;min-height:18px}
#sair{position:fixed;top:8px;right:8px;z-index:50;font-size:12px;padding:4px 10px}
</style>

</head><body>
<div id="login" hidden><form id="lform"><h1>Mapa de Assentos</h1><div class="meta" style="margin:0">Entre com seu e-mail e senha.</div>
<label for="le">E-mail<input id="le" type="email" autocomplete="username" required></label>
<label for="lp">Senha<input id="lp" type="password" autocomplete="current-password" required></label>
<div class="erro" id="lerr"></div><button class="btn" type="submit" id="lbtn">Entrar</button></form></div>
<button class="btn ghost small" id="sair" hidden>Sair</button>
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>

(function(){
  var cfg=window.FIREBASE_CONFIG,$=function(s){return document.querySelector(s)};
  var dbReady,resolveDb;dbReady=new Promise(function(r){resolveDb=r});
  function achata(o,pre,out){out=out||{};Object.keys(o).forEach(function(k){var v=o[k],p=pre?pre+'.'+k:k;if(v&&typeof v==='object'&&!Array.isArray(v)&&Object.keys(v).length)achata(v,p,out);else if(!(v&&typeof v==='object'&&!Array.isArray(v)))out[p]=v});return out}
  function msg(e){var c=e&&e.code||'';if(/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c))return 'E-mail ou senha incorretos.';if(/too-many/.test(c))return 'Muitas tentativas. Espere um pouco e tente de novo.';if(/network/.test(c))return 'Sem conexão com a internet.';return 'Não foi possível entrar.'}
  function mk(fs){return {
    collection:function(n){return fs.collection(n)},
    doc:function(p){var r=fs.doc(p);return {update:function(d){var f=achata(d);return Object.keys(f).length?r.update(f):Promise.resolve()},set:function(d){return r.set(d)},delete:function(){return r.delete()}}}
  }}
  var dlShim={save:async function(x){var ext=(x.filename.split('.').pop()||'').toLowerCase();var tipos={html:'text/html',csv:'text/csv',txt:'text/plain',json:'application/json'};var b=new Blob([x.data],{type:(tipos[ext]||'application/octet-stream')+';charset=utf-8'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=x.filename;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);return {status:'saved'}}};
  window.claude={use:async function(n){if(n==='downloads')return dlShim;if(n==='db')return dbReady;return null}};
  var lg=$('#login');
  if(!cfg||!window.firebase){lg.hidden=false;$('#lform').innerHTML='<h1>Mapa de Assentos</h1><div class="meta">O aplicativo ainda não foi configurado.</div>';return}
  firebase.initializeApp(cfg);
  var auth=firebase.auth(),fs=firebase.firestore();
  try{fs.enablePersistence({synchronizeTabs:true}).catch(function(){})}catch(e){}
  auth.onAuthStateChanged(function(u){
    if(u){lg.hidden=true;$('#sair').hidden=false;resolveDb(mk(fs))}
    else{lg.hidden=false;$('#sair').hidden=true}
  });
  $('#lform').addEventListener('submit',function(ev){ev.preventDefault();$('#lerr').textContent='';$('#lbtn').disabled=true;
    auth.signInWithEmailAndPassword($('#le').value.trim(),$('#lp').value).catch(function(e){$('#lerr').textContent=msg(e)}).then(function(){$('#lbtn').disabled=false})});
  $('#sair').addEventListener('click',function(){auth.signOut().then(function(){location.reload()})});
})();
</script>
<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs">
  <button class="tab" data-a="tab" data-t="rotas">Rotas</button>

  <button class="tab" data-a="tab" data-t="vendedores">Vendedores</button>
</nav>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var LAYOUTS={'2+2':[2,2],'2+1':[2,1],'1+1':[1,1]};

  }
  function busLabel(r){if(isLista(r))return 'Viagem aérea · sem mapa';var o=r.onibus||{},m=MODELOS[o.modelo],n=o.nome||'';if(n==='PRAIA'&&o.modelo==='praia')n='';if(m&&n!==m.nome)return n?n+' · '+m.nome:m.nome;return n||'Ônibus'}

  var MODELOS={

      {nome:'Piso inferior',cols:[2,2],linhas:['Motoristas',[['Sala VIP'],['Cama motorista']],[['Banheiro'],['Escada']],[[],['Hall de entrada']],[[45,46],[48,47]],[[49,50],[52,51]],[[53,54],[56,55]]]}]}
  };
  function decks(r){var o=r.onibus||{};if(MODELOS[o.modelo])return MODELOS[o.modelo].decks;if(o.andares&&o.andares.length)return o.andares;return [{nome:'',fileiras:o.fileiras||0,layout:o.layout||'2+2'}]}
  function per(d){var l=LAYOUTS[d.layout]||LAYOUTS['2+2'];return l[0]+l[1]}

  function cliente(id){for(var i=0;i<clientes.length;i++)if(clientes[i].id===id)return clientes[i];return null}

  function short(n){var p=String(n||'').trim().split(/\s+/);return p.length>1?p[0]+' '+p[p.length-1][0]+'.':p[0]||''}

  function norm(r){var off=0;return decks(r).map(function(d,di){

  function fmtData(v){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v||'');return m?m[3]+'/'+m[2]+'/'+m[1]:(v||'')}
  function dadosLinha(c){if(!c)return '';var a=[];if(c.documento)a.push('CPF '+c.documento);if(c.rg)a.push('RG '+c.rg);if(c.nascimento)a.push('Nasc. '+fmtData(c.nascimento));return a.join(' · ')}
  function csvCel(v){v=String(v==null?'':v);if(/^\d{6,}$/.test(v))return '="'+v+'"';return '"'+v.replace(/"/g,'""')+'"'}
  async function exportarExcel(){
    var r=rota();if(!r)return;
    var rows=[];
    if(isLista(r))paxList(r).forEach(function(x){rows.push({ref:'',c:cliente(x.cid),v:x.vend})});

    if(!rows.length){toast('Não há passageiros para exportar.');return}
    var lista=isLista(r),head=['Nº'].concat(lista?[]:['Assento'],['Nome','CPF','RG','Data de nascimento','Telefone','Quem vendeu']);
    var out=[head.map(csvCel).join(';')];

    var dl=null;try{dl=window.claude&&await window.claude.use('downloads')}catch(e){dl=null}

    catch(e){if(!e||e.code!=='declined')toast('Não foi possível salvar o arquivo.')}
  }
  function achaCli(c,q){

    return [c.documento,c.rg,c.telefone].some(function(v){return String(v||'').toLowerCase().indexOf(q)>-1});
  }

  /* ---------- gravação ---------- */
  async function assign(seat,cid,vend){
    var r=rota(),a=r.assentos||{},v=r.vendedores||{},upd={},vu={};
    Object.keys(a).forEach(function(k){if(a[k]===cid&&k!==String(seat)){upd[k]='';vu[k]='';if(!vend)vend=v[k]||''}});
    if(!vend)vend=vendDe(cid);
    upd[seat]=cid;vu[seat]=vend||'';
    await db.doc('rotas/'+r.id).update({assentos:upd,vendedores:vu});
    return vend||'';
  }
  async function saveCliente(form){
    var d=new FormData(form),data={nome:String(d.get('nome')).trim(),telefone:String(d.get('telefone')||'').trim(),documento:String(d.get('documento')||'').trim(),rg:String(d.get('rg')||'').trim(),nascimento:String(d.get('nascimento')||''),vendedor:String(d.get('vendedor')||'')};
    if(!data.nome)return;
    var s=sheet,id;
    try{
      if(s.id){await db.doc('clientes/'+s.id).update(data);id=s.id}
      else{var ref=db.collection('clientes').doc();data.criado=new Date().toISOString();await ref.set(data);id=ref.id}
      if(s.paxAdd&&rota()&&cheia(rota())){toast('Cliente salvo, mas a lista está completa.');closeSheet();return}
      if(s.paxAdd&&rota()){var px=await addPax(id,s.vend||data.vendedor);toast(short(data.nome)+' adicionado');openSheet({type:'pax',key:px.k,vend:px.vend});return}
      if(s.seat&&rota()){var fv=await assign(s.seat,id,s.vend||data.vendedor);toast(short(data.nome)+' no assento '+s.seat);render();openSheet({type:'seat',seat:s.seat,vend:fv,cid:id});return}
      else toast('Cliente salvo');
      closeSheet();
    }catch(e){fail(e)}
  }
  async function saveRota(form){
    var d=new FormData(form),modelo=d.get('modelo'),onibus;
    var nome=String(d.get('onibus')||'').trim();
    if(modelo==='lista'){
      var vg=parseInt(d.get('vagas'),10)||0;
      if(vg<1||vg>999){toast('Informe o número de vagas.');return}
      var atual=sheet.id&&rota()?paxList(rota()).length:0;
      if(vg<atual){toast('Já há '+atual+' passageiros na lista. Informe pelo menos '+atual+' vagas.');return}
      onibus={nome:'',modelo:'lista',vagas:vg};
    }
    else if(MODELOS[modelo]){onibus={nome:nome||MODELOS[modelo].nome,modelo:modelo}}
    else{
      var fb=Math.max(0,Math.min(25,parseInt(d.get('fileiras-b'),10)||0)),fc=Math.max(0,Math.min(25,parseInt(d.get('fileiras-c'),10)||0));
      if(fb+fc<1){toast('Informe pelo menos uma fileira de assentos.');return}
      var andares=[];
      if(fc>0){if(fb>0)andares.push({nome:'Andar de baixo',fileiras:fb,layout:d.get('layout-b')});andares.push({nome:'Andar de cima',fileiras:fc,layout:d.get('layout-c')})}
      else andares.push({nome:'',fileiras:fb,layout:d.get('layout-b')});
      onibus={nome:nome||'Ônibus',modelo:'personalizado',andares:andares};
    }
    var data={destino:String(d.get('destino')).trim(),origem:'',onibus:onibus};
    try{
      if(sheet.id){await db.doc('rotas/'+sheet.id).update(data)}
      else{var ref=db.collection('rotas').doc();data.assentos={};await ref.set(data);rotaId=ref.id;tab='rotas'}
      toast('Rota salva');closeSheet();
    }catch(e){fail(e)}
  }
  async function delCliente(id){
    try{
      for(var i=0;i<rotas.length;i++){
        var a=rotas[i].assentos||{},upd={},vu={},pu={},any=false,pp=rotas[i].passageiros||{};
        Object.keys(a).forEach(function(k){if(a[k]===id){upd[k]='';vu[k]='';any=true}});
        Object.keys(pp).forEach(function(k){if(pp[k]&&pp[k].cid===id){pu[k]=null;any=true}});
        if(any)await db.doc('rotas/'+rotas[i].id).update({assentos:upd,vendedores:vu,passageiros:pu});
      }
      await db.doc('clientes/'+id).delete();toast('Cliente excluído');closeSheet();
    }catch(e){fail(e)}
  }
  async function delRota(id){
    try{await db.doc('rotas/'+id).delete();rotaId=null;toast('Rota excluída');closeSheet()}catch(e){fail(e)}
  }

      if(sheet.key){var pu={};pu[sheet.key]={vend:pn};db.doc('rotas/'+rotaId).update({passageiros:pu}).then(function(){toast(pn?'Vendedor: '+pn:'Vendedor removido')}).catch(fail)}
    }

      var vv=el.dataset.v,nv=sheet.vend===vv?'':vv,rr=rota();sheet.vend=nv;$('#vchips').innerHTML=chipsHtml(nv);
      if((sheet.cid!==undefined?sheet.cid:(rr.assentos||{})[sheet.seat])){var u={};u[sheet.seat]=nv;db.doc('rotas/'+rr.id).update({vendedores:u}).then(function(){toast(nv?'Vendedor: '+nv:'Vendedor removido')}).catch(fail)}
    }
    else if(a==='salvar-loc'){
      var raw=String($('#loc').value||'').replace(/R\$/gi,'').replace(/\s/g,'').replace(/\./g,'').replace(',','.');
      var num=raw===''?null:parseFloat(raw);
      if(num!==null&&(isNaN(num)||num<0)){toast('Digite um valor válido, por exemplo 8.500,00');return}
      db.doc('rotas/'+rotaId).update({locacao:num}).then(function(){toast(num===null?'Valor removido':'Valor salvo')}).catch(fail);
    }
    else if(a==='grande'){bigOpen=true;drawBig()}
    else if(a==='fechar-grande'){bigOpen=false;drawBig()}
    else if(a==='imprimir')baixarImpressao();
    else if(a==='excel')exportarExcel();
    else if(a==='liberar'){db.doc('rotas/'+rotaId).update((function(){var o={},w={};o[el.dataset.seat]='';w[el.dataset.seat]='';return {assentos:o,vendedores:w}})()).then(function(){toast('Assento '+el.dataset.seat+' liberado');closeSheet()}).catch(fail)}
    else if(a==='pick'){assign(+el.dataset.seat,el.dataset.id,sheet.vend).then(function(v){var c=cliente(el.dataset.id);sheet.cid=el.dataset.id;sheet.vend=v;toast((c?short(c.nome):'Cliente')+' no assento '+el.dataset.seat);render();drawSheet();var bx=document.querySelector('#sheet .sheet');if(bx)bx.scrollTop=0}).catch(fail)}
    else if(a==='novo-cliente')openSheet({type:'cliente'});
    else if(a==='novo-vendedor')openSheet({type:'vendedor'});
    else if(a==='excluir-vendedor'){var vd=vendDocs.filter(function(x){return x.id===el.dataset.id})[0];if(!vd)return;openSheet({type:'confirm',title:'Excluir vendedor?',text:vd.nome+' sai da lista de escolha. Clientes e vendas que já usam esse nome continuam como estão.',yes:function(){db.doc('vendedores/'+vd.id).delete().then(function(){toast('Vendedor excluído');closeSheet()}).catch(fail)}})}
    else if(a==='novo-cliente-seat')openSheet({type:'cliente',seat:sheet.seat,vend:sheet.vend});
    else if(a==='editar-cliente')openSheet({type:'cliente',id:el.dataset.id});
    else if(a==='excluir-cliente'){var c=cliente(el.dataset.id);openSheet({type:'confirm',title:'Excluir cliente?',text:(c?c.nome:'Este cliente')+' será removido do cadastro e liberado de todos os assentos.',yes:function(){delCliente(el.dataset.id)}})}
    else if(a==='confirmar-sim'){var y=sheet.yes;y&&y()}
    else if(a==='fechar')closeSheet();
  });
  document.addEventListener('focusin',function(ev){var t=ev.target;if(t&&t.tagName==='INPUT'&&t.type==='number'&&t.value!==''){try{t.select()}catch(e){}}});
  document.addEventListener('input',function(ev){
    if(ev.target.id==='cq'){q=ev.target.value;$('#clist').innerHTML=cliList()}
    else if(ev.target.id==='sq'&&sheet&&sheet.type==='seat'){$('#slist').innerHTML=pickRows(sheet.seat,ev.target.value)}
    else if(ev.target.id==='sq'&&sheet&&sheet.type==='pax'){$('#slist').innerHTML=paxRows(ev.target.value)}
  });
  document.addEventListener('submit',function(ev){
    var f=ev.target.closest('form[data-form]');if(!f)return;ev.preventDefault();
    if(f.dataset.form==='cliente')saveCliente(f);else if(f.dataset.form==='vendedor')saveVendedor(f);else saveRota(f);
  });

  /* ---------- dados ---------- */
  render();
  (async function(){
    try{db=window.claude&&await window.claude.use('db')}catch(e){db=null}
    if(!db){dbFail=true;render();return}
    db.collection('clientes').onSnapshot(function(s){clientes=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})}).sort(byName);ready.c=true;render()},function(){dbFail=true;render()});
    db.collection('vendedores').onSnapshot(function(s){
      var all=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
      if(!all.length){
        if(s.metadata&&s.metadata.fromCache)return;
        VENDEDORES_PADRAO.forEach(function(v,i){db.collection('vendedores').doc('v'+(i+1)).set({nome:v[0],curto:v[1],ordem:i+1}).catch(function(){})});
        db.collection('vendedores').doc('_cfg').set({semeado:true}).catch(function(){});return;
      }
      vendDocs=all.filter(function(x){return x.id!=='_cfg'&&x.nome}).sort(function(a,b){return (a.ordem||0)-(b.ordem||0)});
      VENDEDORES=vendDocs.map(function(x){return [x.nome,x.curto||x.nome]});
      if(ready.c&&ready.r&&!sheet)render();
    },function(){});
    db.collection('rotas').onSnapshot(function(s){rotas=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})}).sort(function(a,b){return nomeRota(a).localeCompare(nomeRota(b),'pt-BR')});ready.r=true;render()},function(){dbFail=true;render()});
  })();
})();
</script>
</body></html>
